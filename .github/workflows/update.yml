name: update

on:
  schedule:
    - cron: "17 9 * * *"   # daily; Firmpath recomputes reports through the night (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No third-party actions: the first scheduled run (2026-10-12) failed to start, which is what an organisation's
    # allowed-actions policy does to `uses:` it does not list. git and Python 3 are on the runner already, and a job that
    # can push is better off running no one else's code anyway.
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
          python3 --version
      - name: Fetch the published reports
        run: python3 scripts/update.py
      - name: Commit what changed
        run: |
          git add -A reports summary.csv README.md
          if git diff --cached --quiet; then
            echo "No change in any report."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Reports as of $(date -u +%Y-%m-%d)"
          git push
