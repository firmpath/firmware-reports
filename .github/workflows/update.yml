name: update

on:
  schedule:
    - cron: "17 9 * * *"   # daily; Firmpath recomputes reports through the night (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 — pinned by commit: this job can push
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Fetch the published reports
        run: python3 scripts/update.py
      - name: Commit what changed
        run: |
          git add -A reports summary.csv README.md
          if git diff --cached --quiet; then
            echo "No change in any report."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Reports as of $(date -u +%Y-%m-%d)"
          git push
